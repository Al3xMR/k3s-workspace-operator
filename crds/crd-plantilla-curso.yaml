apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plantillascursos.plataforma.epn.edu.ec
spec:
  group: plataforma.epn.edu.ec
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                codigoMateria:
                  type: string
                paralelo:
                  type: string
                nivel:
                  type: integer
                  minimum: 1
                  maximum: 3
                herramientas:
                  type: array
                  items:
                    type: string
              required: ["codigoMateria", "paralelo", "nivel"]
            status:
              type: object
              properties:
                fase:
                  type: string
                  enum: ["Pending", "Building", "Ready", "Failed"]
                imagenTag:
                  type: string
      additionalPrinterColumns:
        - name: Materia
          type: string
          jsonPath: .spec.codigoMateria
        - name: Paralelo
          type: string
          jsonPath: .spec.paralelo
        - name: Nivel
          type: integer
          jsonPath: .spec.nivel
        - name: Estado
          type: string
          jsonPath: .status.fase
  scope: Namespaced
  names:
    plural: plantillascursos
    singular: plantillacurso
    kind: PlantillaCurso
    shortNames:
      - pcurso