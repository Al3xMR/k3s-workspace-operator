apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: laboratorios.plataforma.epn.edu.ec
spec:
  group: plataforma.epn.edu.ec
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                correoInstitucional:
                  type: string
                codigoMateria:
                  type: string
                paralelo:
                  type: string
                nivel:
                  type: integer
                  minimum: 1
                  maximum: 3
                tiempoInactividadMinutos:
                  type: integer
                  default: 30
                  minimum: 5
              required: ["correoInstitucional", "codigoMateria", "paralelo", "nivel"]
            status:
              type: object
              properties:
                fase:
                  type: string
                  enum: ["Pending", "Provisioning", "Running", "Hibernating", "Terminating", "Failed"]
                urlAcceso:
                  type: string
                ultimaActividad:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Estudiante
          type: string
          jsonPath: .spec.correoInstitucional
        - name: Materia
          type: string
          jsonPath: .spec.codigoMateria
        - name: Paralelo
          type: string
          jsonPath: .spec.paralelo
        - name: Nivel
          type: integer
          jsonPath: .spec.nivel
        - name: Estado
          type: string
          jsonPath: .status.fase
  scope: Namespaced
  names:
    plural: laboratorios
    singular: laboratorio
    kind: Laboratorio
    shortNames:
      - lab