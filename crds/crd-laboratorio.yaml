apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: laboratorios.plataforma.epn.edu.ec
spec:
  group: plataforma.epn.edu.ec
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "Esquema base para el aprovisionamiento de entornos de desarrollo"
          properties:
            spec:
              type: object
              properties:
                correoInstitucional:
                  type: string
                  description: "Correo institucional del estudiante provisto por el SSO"
                codigoMateria:
                  type: string
                  description: "Código unificado de la asignatura (ej. ICCD654)"
                paralelo:
                  type: string
                  description: "Código del grupo/paralelo (ej. GR1CC, GR1SW)"
                nivel:
                  type: integer
                  minimum: 1
                  maximum: 3
                  description: "Nivel del laboratorio: 1 (ttyd), 2 (code-server), 3 (KasmVNC)"
              required: ["correoInstitucional", "codigoMateria", "paralelo", "nivel"]
            status:
              type: object
              properties:
                fase:
                  type: string
                  description: "Estado del ciclo de vida: Pending, Provisioning, Running, Hibernating, Terminating"
                urlAcceso:
                  type: string
                  description: "URL HTTPS/WSS generada por el Ingress para el iframe"
      additionalPrinterColumns:
        - name: Estudiante
          type: string
          jsonPath: .spec.correoInstitucional
        - name: Materia
          type: string
          jsonPath: .spec.codigoMateria
        - name: Paralelo
          type: string
          jsonPath: .spec.paralelo
        - name: Nivel
          type: integer
          jsonPath: .spec.nivel
        - name: Estado
          type: string
          jsonPath: .status.fase
  scope: Namespaced
  names:
    plural: laboratorios
    singular: laboratorio
    kind: Laboratorio
    shortNames:
      - lab